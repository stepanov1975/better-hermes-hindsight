name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private memories, transcripts, endpoints, or bank IDs.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide a minimal public-safe reproduction.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Provider, Hermes Agent, Hindsight server, client, and Python versions.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Logs or traces with all sensitive values removed.
