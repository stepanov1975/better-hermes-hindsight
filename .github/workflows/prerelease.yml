name: Prerelease

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Full commit SHA selected for the prerelease tag
        required: true
        type: string
      publish_pypi:
        description: Publish the verified artifact to PyPI
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-candidate:
    name: Build exact tagged candidate
    if: github.ref_type == 'tag' && inputs.expected_commit == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact candidate
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out supported Hermes host
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NousResearch/hermes-agent
          ref: 3c27eb6234bf91b8ceee9e9071591b31e9b148cb
          path: .compat/hermes-current
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v6.3.0
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv==0.11.4

      - name: Verify immutable prerelease identity
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git -C .compat/hermes-current rev-parse HEAD)" = \
            "3c27eb6234bf91b8ceee9e9071591b31e9b148cb"
          python - <<'PY'
          import os
          import tomllib
          from packaging.version import Version

          with open("pyproject.toml", "rb") as stream:
              version = tomllib.load(stream)["project"]["version"]
          parsed = Version(version)
          if not parsed.is_prerelease:
              raise SystemExit("release workflow accepts prerelease versions only")
          if os.environ["GITHUB_REF_NAME"] != f"v{version}":
              raise SystemExit("tag does not match package version")
          PY

      - name: Sync locked environment
        run: uv sync --frozen --extra dev

      - name: Install supported host contract
        run: |
          uv pip install --python .venv/bin/python -e .compat/hermes-current \
            'hindsight-client==0.8.5'
          uv pip check --python .venv/bin/python

      - name: Run release gates and build distributions
        env:
          BETTER_HINDSIGHT_EXPECT_HERMES_VERSION: "0.20.0"
        run: |
          uv lock --check
          .venv/bin/python -m ruff check .
          .venv/bin/python -m ruff format --check .
          .venv/bin/python -m mypy
          .venv/bin/python -m pytest
          rm -rf dist
          .venv/bin/python -m build
          .venv/bin/python -m twine check dist/*
          sha256sum dist/* > dist/SHA256SUMS

      - name: Smoke-test wheel in a fresh environment
        run: |
          python -m venv "${RUNNER_TEMP}/wheel-smoke"
          "${RUNNER_TEMP}/wheel-smoke/bin/python" -m pip install --no-deps dist/*.whl
          "${RUNNER_TEMP}/wheel-smoke/bin/python" - <<'PY'
          import better_hermes_hindsight as plugin

          assert plugin.PROVIDER_ID == "better_hindsight"
          assert plugin.__version__ == "0.1.0a1"
          PY

      - name: Upload immutable candidate artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: better-hermes-hindsight-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish-pypi:
    name: Publish approved candidate to PyPI
    needs: build-candidate
    if: inputs.publish_pypi == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download exact candidate artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: better-hermes-hindsight-${{ github.sha }}
          path: candidate

      - name: Verify candidate checksums
        run: |
          sha256sum --check candidate/SHA256SUMS
          rm candidate/SHA256SUMS

      - name: Publish exact candidate to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: candidate/
          print-hash: true
