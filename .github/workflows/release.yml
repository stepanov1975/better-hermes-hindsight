name: Source snapshot release

on:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: source-snapshot-release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Determine source snapshot state
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          RELEASE_JSON_FILE: ${{ runner.temp }}/release.json
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
          RELEASES_JSON_FILE: ${{ runner.temp }}/releases.json
        run: |
          set -euo pipefail
          metadata=$(python scripts/release_snapshot.py --notes-output "$RELEASE_NOTES_FILE")
          version=$(jq -r '.version' <<<"$metadata")
          tag=$(jq -r '.tag' <<<"$metadata")
          prerelease=$(jq -r '.prerelease' <<<"$metadata")
          printf 'version=%s\ntag=%s\nprerelease=%s\n' \
            "$version" "$tag" "$prerelease" >> "$GITHUB_OUTPUT"

          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq 'add' > "$RELEASES_JSON_FILE"
          release_count=$(jq --arg tag "$tag" \
            '[.[] | select(.tag_name == $tag)] | length' "$RELEASES_JSON_FILE")
          if [[ "$release_count" -gt 1 ]]; then
            echo "Multiple GitHub releases claim ${tag}; refusing ambiguous repair." >&2
            exit 1
          fi
          release_id=$(jq -r --arg tag "$tag" \
            '[.[] | select(.tag_name == $tag)][0].id // empty' "$RELEASES_JSON_FILE")

          tag_sha=""
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            git fetch --force --no-tags origin "refs/tags/${tag}:refs/tags/${tag}"
            tag_sha=$(git rev-list -n 1 "$tag")
          else
            ls_remote_status=$?
            if [[ "$ls_remote_status" -ne 2 ]]; then
              echo "Unable to determine whether tag ${tag} exists (git ls-remote exit ${ls_remote_status})." >&2
              exit "$ls_remote_status"
            fi
          fi

          if [[ -n "$release_id" ]]; then
            jq --argjson id "$release_id" '.[] | select(.id == $id)' \
              "$RELEASES_JSON_FILE" > "$RELEASE_JSON_FILE"
            python - "$RELEASE_JSON_FILE" "$RELEASE_NOTES_FILE" \
              "$prerelease" "$HEAD_SHA" "$tag_sha" <<'PY'
          import json
          import pathlib
          import sys

          release = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          notes = pathlib.Path(sys.argv[2]).read_text(encoding="utf-8")
          expected_prerelease = sys.argv[3] == "true"
          expected_sha = sys.argv[4]
          tag_sha = sys.argv[5]
          if release["assets"]:
              raise SystemExit("Source snapshot has attached assets")
          if release["prerelease"] is not expected_prerelease:
              raise SystemExit("Source snapshot has the wrong prerelease state")
          if release["draft"]:
              if release["body"].rstrip() != notes.rstrip():
                  raise SystemExit("Draft source snapshot notes do not match CHANGELOG.md")
              if not tag_sha and release["target_commitish"] != expected_sha:
                  raise SystemExit("Tagless draft source snapshot targets the wrong commit")
          elif not tag_sha:
              raise SystemExit("Published source snapshot has no immutable tag")
          PY
            draft=$(jq -r '.draft' "$RELEASE_JSON_FILE")
            if [[ "$draft" == false ]]; then
              if ! git merge-base --is-ancestor "$tag_sha" "$HEAD_SHA"; then
                echo "Published tag ${tag} is not an ancestor of ${HEAD_SHA}." >&2
                exit 1
              fi
              tag_version=$(git show "${tag}:pyproject.toml" \
                | python -c 'import sys, tomllib; print(tomllib.loads(sys.stdin.read())["project"]["version"])')
              if [[ "$tag_version" != "$version" ]]; then
                echo "Published tag ${tag} contains version ${tag_version}, not ${version}." >&2
                exit 1
              fi
              echo "Published source snapshot ${tag} already exists; no release needed."
              printf 'needed=false\ndraft_exists=false\nrelease_id=%s\n' \
                "$release_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            draft=false
          fi

          if [[ -n "$tag_sha" && "$tag_sha" != "$HEAD_SHA" ]]; then
            echo "Unpublished tag ${tag} targets ${tag_sha}, not verified commit ${HEAD_SHA}." >&2
            exit 1
          fi
          if [[ -z "$tag_sha" ]]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${tag}" -f sha="$HEAD_SHA" >/dev/null
            git fetch --force --no-tags origin "refs/tags/${tag}:refs/tags/${tag}"
            tag_sha=$(git rev-list -n 1 "$tag")
            if [[ "$tag_sha" != "$HEAD_SHA" ]]; then
              echo "Created tag ${tag} targets ${tag_sha}, not ${HEAD_SHA}." >&2
              exit 1
            fi
          fi

          printf 'needed=true\ndraft_exists=%s\nrelease_id=%s\n' \
            "$draft" "$release_id" >> "$GITHUB_OUTPUT"

      - name: Create draft source snapshot
        if: steps.release.outputs.needed == 'true' && steps.release.outputs.draft_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
          RELEASE_PRERELEASE: ${{ steps.release.outputs.prerelease }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          prerelease_args=()
          if [[ "$RELEASE_PRERELEASE" == true ]]; then
            prerelease_args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            "${prerelease_args[@]}" \
            --target "$HEAD_SHA" \
            --verify-tag \
            --title "Better Hermes Hindsight ${RELEASE_VERSION}" \
            --notes-file "$RELEASE_NOTES_FILE"

      - name: Refresh existing draft notes
        if: steps.release.outputs.needed == 'true' && steps.release.outputs.draft_exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          RELEASE_JSON_FILE: ${{ runner.temp }}/release-refreshed.json
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
          RELEASE_PAYLOAD_FILE: ${{ runner.temp }}/release-payload.json
          RELEASE_PRERELEASE: ${{ steps.release.outputs.prerelease }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          python - "$RELEASE_PAYLOAD_FILE" "$RELEASE_NOTES_FILE" \
            "$RELEASE_PRERELEASE" "$RELEASE_VERSION" <<'PY'
          import json
          import pathlib
          import sys

          payload_path = pathlib.Path(sys.argv[1])
          notes = pathlib.Path(sys.argv[2]).read_text(encoding="utf-8")
          payload_path.write_text(
              json.dumps(
                  {
                      "name": f"Better Hermes Hindsight {sys.argv[4]}",
                      "body": notes,
                      "draft": True,
                      "prerelease": sys.argv[3] == "true",
                  }
              ),
              encoding="utf-8",
          )
          PY
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            --input "$RELEASE_PAYLOAD_FILE" > "$RELEASE_JSON_FILE"

      - name: Verify draft and publish
        id: publish
        if: steps.release.outputs.needed == 'true'
        env:
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_JSON_FILE: ${{ runner.temp }}/release-draft.json
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
          RELEASE_PAYLOAD_FILE: ${{ runner.temp }}/release-publish.json
          RELEASE_PRERELEASE: ${{ steps.release.outputs.prerelease }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASES_JSON_FILE: ${{ runner.temp }}/releases-after-create.json
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq 'add' > "$RELEASES_JSON_FILE"
          release_count=$(jq --arg tag "$RELEASE_TAG" \
            '[.[] | select(.tag_name == $tag)] | length' "$RELEASES_JSON_FILE")
          if [[ "$release_count" -ne 1 ]]; then
            echo "Expected exactly one draft for ${RELEASE_TAG}; found ${release_count}." >&2
            exit 1
          fi
          release_id=$(jq -r --arg tag "$RELEASE_TAG" \
            '[.[] | select(.tag_name == $tag)][0].id' "$RELEASES_JSON_FILE")
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            > "$RELEASE_JSON_FILE"

          git fetch --force --no-tags origin \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          tag_sha=$(git rev-list -n 1 "$RELEASE_TAG")
          if [[ "$tag_sha" != "$EXPECTED_SHA" ]]; then
            echo "Draft tag ${RELEASE_TAG} points to ${tag_sha}, expected ${EXPECTED_SHA}." >&2
            exit 1
          fi

          python - "$RELEASE_JSON_FILE" "$RELEASE_NOTES_FILE" \
            "$RELEASE_PRERELEASE" "$RELEASE_TAG" "$RELEASE_VERSION" <<'PY'
          import json
          import pathlib
          import sys

          release = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          notes = pathlib.Path(sys.argv[2]).read_text(encoding="utf-8")
          expected_prerelease = sys.argv[3] == "true"
          if release["tag_name"] != sys.argv[4]:
              raise SystemExit("Draft release has the wrong tag")
          if release["name"] != f"Better Hermes Hindsight {sys.argv[5]}":
              raise SystemExit("Draft release has the wrong title")
          if release["draft"] is not True:
              raise SystemExit("Release is not a draft")
          if release["prerelease"] is not expected_prerelease:
              raise SystemExit("Draft release has the wrong prerelease state")
          if release["assets"]:
              raise SystemExit("Draft source snapshot has attached assets")
          if release["body"].rstrip() != notes.rstrip():
              raise SystemExit("Draft release notes do not match CHANGELOG.md")
          PY
          python - "$RELEASE_PAYLOAD_FILE" "$RELEASE_PRERELEASE" <<'PY'
          import json
          import pathlib
          import sys

          pathlib.Path(sys.argv[1]).write_text(
              json.dumps({"draft": False, "prerelease": sys.argv[2] == "true"}),
              encoding="utf-8",
          )
          PY
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            --input "$RELEASE_PAYLOAD_FILE" > /dev/null
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"

      - name: Verify published source snapshot
        if: steps.release.outputs.needed == 'true'
        env:
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.publish.outputs.release_id }}
          RELEASE_JSON_FILE: ${{ runner.temp }}/release-final.json
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
          RELEASE_PRERELEASE: ${{ steps.release.outputs.prerelease }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            > "$RELEASE_JSON_FILE"
          python - "$RELEASE_JSON_FILE" "$RELEASE_NOTES_FILE" \
            "$RELEASE_PRERELEASE" "$RELEASE_TAG" "$RELEASE_VERSION" <<'PY'
          import json
          import pathlib
          import sys

          release = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          notes = pathlib.Path(sys.argv[2]).read_text(encoding="utf-8")
          expected_prerelease = sys.argv[3] == "true"
          if release["tag_name"] != sys.argv[4]:
              raise SystemExit("Published release has the wrong tag")
          if release["name"] != f"Better Hermes Hindsight {sys.argv[5]}":
              raise SystemExit("Published release has the wrong title")
          if release["draft"] is not False:
              raise SystemExit("Release was not published")
          if release["prerelease"] is not expected_prerelease:
              raise SystemExit("Published release has the wrong prerelease state")
          if release["assets"]:
              raise SystemExit("Published source snapshot has attached assets")
          if release["body"].rstrip() != notes.rstrip():
              raise SystemExit("Published release notes do not match CHANGELOG.md")
          PY
          git fetch --force --no-tags origin \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          tag_sha=$(git rev-list -n 1 "$RELEASE_TAG")
          if [[ "$tag_sha" != "$EXPECTED_SHA" ]]; then
            echo "Published tag ${RELEASE_TAG} points to ${tag_sha}, expected ${EXPECTED_SHA}." >&2
            exit 1
          fi
