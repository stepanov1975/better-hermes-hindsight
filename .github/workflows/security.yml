name: Security scans

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

env:
  ACTIONLINT_IMAGE: docker.io/rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/repo" \
            -w /repo \
            "${GITLEAKS_IMAGE}" \
            detect --source=/repo --config=/repo/.gitleaks.toml --redact --verbose

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/repo" \
            -w /repo \
            "${ACTIONLINT_IMAGE}" \
            -color

  python-security:
    name: Python static/security checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-audit.txt
            requirements-ci.txt
            requirements-security.txt

      - name: Install scanners and audit tools
        run: >-
          python -m pip install
          --requirement requirements-audit.txt
          --requirement requirements-security.txt

      - name: Run Semgrep
        run: semgrep scan --config p/ci --config p/secrets --error --metrics=off .

      - name: Run zizmor
        run: zizmor .github/workflows

      - name: Audit CI and scanner toolchains
        run: |
          set -euo pipefail
          pip-audit --progress-spinner off -r requirements-audit.txt
          pip-audit --progress-spinner off -r requirements-ci.txt
          pip-audit --progress-spinner off -r requirements-security.txt

  runtime-audit:
    name: Runtime dependency audit / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-audit.txt

      - name: Install audit tools
        run: python -m pip install --requirement requirements-audit.txt

      - name: Audit locked runtime dependencies
        run: |
          set -euo pipefail
          uv export --frozen --no-dev --no-emit-project \
            --python "${{ matrix.python-version }}" \
            --format requirements-txt \
            --output-file "${RUNNER_TEMP}/runtime-requirements.txt" \
            >/dev/null
          pip-audit --progress-spinner off -r "${RUNNER_TEMP}/runtime-requirements.txt"
