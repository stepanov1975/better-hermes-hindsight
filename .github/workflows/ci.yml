name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  test-current-hermes:
    name: Python 3.13 / Hermes main
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Better Hindsight
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out current Hermes
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NousResearch/hermes-agent
          ref: main
          path: .compat/hermes-current
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v6.3.0
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv==0.11.4

      - name: Install development environment and current Hermes
        run: |
          uv sync --frozen --extra dev
          uv pip install --python .venv/bin/python -e .compat/hermes-current
          uv pip install --python .venv/bin/python 'hindsight-client==0.8.5'
          uv pip check --python .venv/bin/python

      - name: Record tested source identities
        run: |
          echo "Better $(git rev-parse HEAD)"
          echo "Hermes $(git -C .compat/hermes-current rev-parse HEAD)"
          .venv/bin/python -c 'from importlib.metadata import version; print("Hermes package", version("hermes-agent")); print("Hindsight client", version("hindsight-client"))'

      - name: Validate
        run: |
          uv lock --check
          .venv/bin/python -m ruff check .
          .venv/bin/python -m ruff format --check .
          .venv/bin/python -m mypy
          .venv/bin/python -m pytest -p no:cacheprovider
          rm -rf dist
          .venv/bin/python -m build
          git diff --check
