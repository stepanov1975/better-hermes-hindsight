name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v6.3.0
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install uv==0.11.4

      - name: Sync locked environment
        run: uv sync --frozen --extra dev --extra proof

      - name: Check lock file
        run: uv lock --check

      - name: Run tests
        run: uv run --frozen --extra dev --extra proof python -m pytest

      - name: Run Ruff
        run: |
          uv run --frozen --extra dev --extra proof python -m ruff check .
          uv run --frozen --extra dev --extra proof python -m ruff format --check .

      - name: Run mypy
        run: uv run --frozen --extra dev --extra proof python -m mypy

      - name: Build and inspect distributions
        run: |
          rm -rf dist
          uv run --frozen --extra dev --extra proof python -m build
          uv run --frozen --extra dev --extra proof python -m twine check dist/*

      - name: Smoke-test wheel in a fresh environment
        run: |
          python -m venv "${RUNNER_TEMP}/wheel-smoke"
          "${RUNNER_TEMP}/wheel-smoke/bin/python" -m pip install --no-deps dist/*.whl
          "${RUNNER_TEMP}/wheel-smoke/bin/python" -c "import better_hermes_hindsight as p; assert p.PROVIDER_ID == 'better_hindsight'"
