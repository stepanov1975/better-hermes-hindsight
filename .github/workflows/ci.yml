name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

env:
  PINNED_HERMES_REF: 2584b7c4eca82ada05f16eba08936d157b483329

jobs:
  test-pinned-hermes:
    name: Python ${{ matrix.python-version }} / Hermes pinned
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out Better Hindsight
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out pinned Hermes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ env.PINNED_HERMES_REF }}
          path: .compat/hermes-current
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install development environment and pinned Hermes
        run: |
          python -m pip install --requirement requirements-ci.txt
          uv sync --frozen --extra dev --python "${{ matrix.python-version }}"
          uv pip install --python .venv/bin/python -e .compat/hermes-current
          uv pip check --python .venv/bin/python

      - name: Record tested source identities
        run: |
          echo "Better $(git rev-parse HEAD)"
          echo "Hermes $(git -C .compat/hermes-current rev-parse HEAD)"
          .venv/bin/python -c 'from importlib.metadata import version; print("Hermes package", version("hermes-agent")); print("aiohttp", version("aiohttp"))'

      - name: Run deterministic tests
        run: .venv/bin/python -m pytest -p no:cacheprovider

      - name: Validate lint, types, and distributions
        if: matrix.python-version == '3.13'
        run: |
          uv lock --check
          .venv/bin/python -m ruff check better_hermes_hindsight tests scripts __init__.py cli.py
          .venv/bin/python -m ruff format --check better_hermes_hindsight tests scripts __init__.py cli.py
          .venv/bin/python -m mypy
          rm -rf dist
          uv build --out-dir dist
          twine check dist/*.whl dist/*.tar.gz
          .venv/bin/python scripts/check_sdist.py dist/*.tar.gz
          git diff --check

  test-current-hermes:
    name: Python 3.13 / Hermes main canary
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Better Hindsight
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out current Hermes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: main
          path: .compat/hermes-current
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install development environment and current Hermes
        run: |
          python -m pip install --requirement requirements-ci.txt
          uv sync --frozen --extra dev
          uv pip install --python .venv/bin/python -e .compat/hermes-current
          uv pip check --python .venv/bin/python

      - name: Record tested source identities
        run: |
          echo "Better $(git rev-parse HEAD)"
          echo "Hermes $(git -C .compat/hermes-current rev-parse HEAD)"
          .venv/bin/python -c 'from importlib.metadata import version; print("Hermes package", version("hermes-agent")); print("aiohttp", version("aiohttp"))'

      - name: Run compatibility canary
        run: .venv/bin/python -m pytest -p no:cacheprovider

  test-live-hindsight:
    name: Python 3.13 / Hindsight ${{ matrix.hindsight-version }} live
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - hindsight-version: "0.9.2"
            image: ghcr.io/vectorize-io/hindsight@sha256:84ab276b8f501546deb6ea9c64a57291718b4e16a59dd9e02a02fdd5adfe9028
          - hindsight-version: "0.10.0"
            image: ghcr.io/vectorize-io/hindsight@sha256:e34028bf84b5bc800029e5d3b13db2c469484dfe5b557b84c577d97fd6af1c74

    services:
      postgres:
        image: pgvector/pgvector@sha256:12a379b47ad65289572ea0756efc11b7c241a6662833e8af7038cd3b73d647e0
        env:
          POSTGRES_USER: synthetic
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: synthetic
        options: >-
          --health-cmd "pg_isready -U synthetic -d synthetic"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      hindsight:
        image: ${{ matrix.image }}
        env:
          HINDSIGHT_API_DATABASE_URL: postgresql://synthetic:synthetic-ci-only@postgres:5432/synthetic
          HINDSIGHT_API_VECTOR_EXTENSION: pgvector
          HINDSIGHT_API_LLM_PROVIDER: mock
          HINDSIGHT_API_LLM_MODEL: mock-model
          HINDSIGHT_API_LLM_API_KEY: synthetic-ci-key
          HINDSIGHT_API_TOKENIZER_ENCODING: cl100k_base
          HINDSIGHT_API_RECALL_MAX_QUERY_TOKENS: "500"
          HINDSIGHT_ENABLE_CP: "false"
        ports:
          - 127.0.0.1:8888:8888
        options: >-
          --health-cmd "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8888/health\", timeout=4)'"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 90

    steps:
      - name: Check out Better Hindsight
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out current Hermes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: main
          path: .compat/hermes-current
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install development environment and current Hermes
        run: |
          python -m pip install --requirement requirements-ci.txt
          uv sync --frozen --extra dev
          uv pip install --python .venv/bin/python -e .compat/hermes-current
          uv pip check --python .venv/bin/python

      - name: Record tested source identities
        run: |
          echo "Better $(git rev-parse HEAD)"
          echo "Hermes $(git -C .compat/hermes-current rev-parse HEAD)"
          echo "Hindsight ${{ matrix.hindsight-version }} ${{ matrix.image }}"
          curl --fail --silent --show-error http://127.0.0.1:8888/version
          echo

      - name: Run isolated live compatibility proof
        env:
          BETTER_HINDSIGHT_ALLOW_DEV_WRITES: "1"
          BETTER_HINDSIGHT_REQUIRE_LIVE_PROOF: "1"
          BETTER_HINDSIGHT_DEV_API_URL: http://127.0.0.1:8888
          BETTER_HINDSIGHT_DEV_API_KEY: synthetic-ci-key
          BETTER_HINDSIGHT_DEV_EXPECTED_VERSION: ${{ matrix.hindsight-version }}
        run: |
          export BETTER_HINDSIGHT_DEV_HERMES_PYTHON="$PWD/.venv/bin/python"
          .venv/bin/python -m pytest -p no:cacheprovider tests/integration/test_isolated_hindsight.py

  release:
    name: Publish new source snapshot
    needs: [test-pinned-hermes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    # Job-level reusable workflows resolve from the caller commit, not the runner workspace.
    # actionlint 1.7.12 rejects $/; remove this exception when the pinned version supports it.
    uses: ./.github/workflows/release.yml # zizmor: ignore[self-repository]
