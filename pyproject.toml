[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "better-hermes-hindsight"
version = "0.5.0"
description = "External Hindsight memory provider plugin for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Alex Stepanov" }]
keywords = ["hermes-agent", "hindsight", "memory", "plugin"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["aiohttp>=3.14.1,<4", "tiktoken>=0.12,<0.15"]

[project.optional-dependencies]
dev = [
  "mypy>=1.18,<3",
  "pyyaml>=6,<7",
  "pytest>=8,<10",
  "ruff>=0.15,<0.17",
  "types-pyyaml>=6.0.12,<7",
]

[project.urls]
Repository = "https://github.com/stepanov1975/better-hermes-hindsight"
Issues = "https://github.com/stepanov1975/better-hermes-hindsight/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["better_hermes_hindsight*"]

[tool.setuptools.package-data]
better_hermes_hindsight = ["data/*.tiktoken"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
  "isolated_hindsight_live: explicitly authorized write-enabled proof against a disposable Hindsight instance",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["better_hermes_hindsight", "tests"]
mypy_path = "."
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["agent.*", "plugins.memory"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
