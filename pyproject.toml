[build-system]
requires = ["setuptools>=77,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "better-hermes-hindsight"
version = "0.1.0a1"
description = "Experimental external Hindsight memory provider project for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alex Stepanov" }]
keywords = ["hermes-agent", "hindsight", "memory", "plugin"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["hindsight-client==0.8.5"]

[project.optional-dependencies]
dev = [
  "mypy>=1.18,<3",
  "pyyaml>=6,<7",
  "pytest>=8,<10",
  "ruff>=0.15,<0.16",
  "types-pyyaml>=6.0.12,<7",
]

[project.urls]
Repository = "https://github.com/stepanov1975/better-hermes-hindsight"
Issues = "https://github.com/stepanov1975/better-hermes-hindsight/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["better_hermes_hindsight*"]

[tool.setuptools.package-data]
"better_hermes_hindsight.hermes_plugin" = ["plugin.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
  "isolated_hindsight_live: explicitly authorized write-enabled proof against a disposable Hindsight instance",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["agent.*", "plugins.memory"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
